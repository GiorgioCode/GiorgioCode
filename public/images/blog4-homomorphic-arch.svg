<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #4b5563; }
    rect, line, path { stroke: #4b5563; stroke-width: 1.5; }
  </style>
  <text x="320" y="30" text-anchor="middle">Arquitectura de base vectorial con cifrado homomorfico</text>

  <rect x="40" y="70" width="190" height="70" fill="none" stroke="#4b5563"/>
  <text x="135" y="95" text-anchor="middle">Cliente</text>
  <text x="135" y="115" text-anchor="middle">Embeddings + cifrado</text>

  <rect x="360" y="70" width="240" height="190" fill="none" stroke="#4b5563"/>
  <text x="480" y="95" text-anchor="middle">Servidor / Base vectorial</text>
  <rect x="390" y="120" width="180" height="50" fill="none" stroke="#4b5563"/>
  <text x="480" y="145" text-anchor="middle">Vectores cifrados</text>
  <rect x="390" y="190" width="180" height="50" fill="none" stroke="#4b5563"/>
  <text x="480" y="215" text-anchor="middle">Calculo de similitud</text>
  <text x="480" y="235" text-anchor="middle">sobre datos cifrados</text>

  <line x1="230" y1="105" x2="360" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="295" y="95" text-anchor="middle">Vectores cifrados</text>
  <line x1="360" y1="255" x2="230" y2="255" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow-left)"/>
  <text x="295" y="245" text-anchor="middle">Resultados cifrados</text>

  <rect x="60" y="220" width="150" height="50" fill="none" stroke="#4b5563"/>
  <text x="135" y="245" text-anchor="middle">Descifrado</text>
  <text x="135" y="265" text-anchor="middle">y respuesta en claro</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-left" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
