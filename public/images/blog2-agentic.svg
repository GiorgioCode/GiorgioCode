<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380">
  <style>text{font-family:Arial,sans-serif;font-size:14px;fill:#4b5563;} rect,line,path{stroke:#4b5563;}</style>
  <text x="350" y="30" text-anchor="middle">Arquitectura Agentic-RAG</text>
  <rect x="300" y="50" width="200" height="60" fill="none" stroke="#4b5563"/>
  <text x="400" y="85" text-anchor="middle">LLM Agent</text>
  <line x1="400" y1="110" x2="200" y2="150" stroke="#4b5563" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="400" y2="150" stroke="#4b5563" marker-end="url(#arrow)"/>
  <line x1="400" y1="110" x2="600" y2="150" stroke="#4b5563" marker-end="url(#arrow)"/>
  <rect x="100" y="150" width="200" height="60" fill="none" stroke="#4b5563"/>
