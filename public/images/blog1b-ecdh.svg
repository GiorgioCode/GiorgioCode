<svg width="100%" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th-purple { font-size: 14px; font-weight: 500; fill: #3C3489; }
      .ts-purple  { font-size: 12px; font-weight: 400; fill: #534AB7; }
      .th-teal    { font-size: 14px; font-weight: 500; fill: #085041; }
      .ts-teal    { font-size: 12px; font-weight: 400; fill: #0F6E56; }
      .th-gray    { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts-gray    { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .ts-ann     { font-size: 12px; font-weight: 400; fill: #444441; }
    </style>
  </defs>

  <!-- lineas de vida -->
  <line x1="160" y1="88" x2="160" y2="460" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="520" y1="88" x2="520" y2="460" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- encabezado Alice -->
  <rect x="60" y="30" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th-purple" x="160" y="52" text-anchor="middle" dominant-baseline="central">Alice</text>
  <text class="ts-purple" x="160" y="70" text-anchor="middle" dominant-baseline="central">genera privA, pubA</text>

  <!-- encabezado Bob -->
  <rect x="420" y="30" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="520" y="52" text-anchor="middle" dominant-baseline="central">Bob</text>
  <text class="ts-teal" x="520" y="70" text-anchor="middle" dominant-baseline="central">genera privB, pubB</text>

  <!-- paso 1: Alice envia pubA -->
  <rect x="60" y="118" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th-purple" x="160" y="140" text-anchor="middle" dominant-baseline="central">pubA = privA * G</text>
  <line x1="262" y1="140" x2="418" y2="140" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="340" y="132" text-anchor="middle">envia pubA</text>

  <!-- paso 2: Bob envia pubB -->
  <rect x="420" y="188" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="520" y="210" text-anchor="middle" dominant-baseline="central">pubB = privB * G</text>
  <line x1="418" y1="210" x2="262" y2="210" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="340" y="202" text-anchor="middle">envia pubB</text>

  <!-- paso 3: calculo del secreto (Alice) -->
  <rect x="60" y="268" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th-purple" x="160" y="288" text-anchor="middle" dominant-baseline="central">secreto = privA * pubB</text>
  <text class="ts-purple" x="160" y="306" text-anchor="middle" dominant-baseline="central">sin enviar nada</text>

  <!-- paso 3: calculo del secreto (Bob) -->
  <rect x="420" y="268" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="520" y="288" text-anchor="middle" dominant-baseline="central">secreto = privB * pubA</text>
  <text class="ts-teal" x="520" y="306" text-anchor="middle" dominant-baseline="central">sin enviar nada</text>

  <!-- igualdad en el centro -->
  <text class="ts-ann" x="340" y="285" text-anchor="middle">privA * pubB</text>
  <text class="ts-ann" x="340" y="300" text-anchor="middle">= privB * pubA</text>

  <!-- paso 4: KDF Alice -->
  <rect x="60" y="368" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th-gray" x="160" y="388" text-anchor="middle" dominant-baseline="central">KDF(secreto)</text>
  <text class="ts-gray" x="160" y="406" text-anchor="middle" dominant-baseline="central">clave AES-256</text>

  <!-- paso 4: KDF Bob -->
  <rect x="420" y="368" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th-gray" x="520" y="388" text-anchor="middle" dominant-baseline="central">KDF(secreto)</text>
  <text class="ts-gray" x="520" y="406" text-anchor="middle" dominant-baseline="central">clave AES-256</text>

  <!-- resultado compartido en el centro -->
  <rect x="250" y="368" width="180" height="56" rx="8" fill="none" stroke="#888780" stroke-width="0.5"/>
  <text class="th-gray" x="340" y="388" text-anchor="middle" dominant-baseline="central">misma clave</text>
  <text class="ts-gray" x="340" y="406" text-anchor="middle" dominant-baseline="central">nunca transmitida</text>

  <line x1="260" y1="396" x2="248" y2="396" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="396" x2="432" y2="396" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- leyenda -->
  <text class="ts-ann" x="340" y="490" text-anchor="middle">G = punto generador de la curva. La clave privada nunca abandona su parte.</text>
</svg>
