<svg width="100%" viewBox="0 0 680 340" role="img">
<title>El triángulo de la alineación</title>
<desc>Diagrama que muestra las tres dimensiones de la alineación: Intención, Robustez y Capacidad, dispuestas en un triángulo con tensiones entre ellas.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<!-- Triangle lines -->
<line x1="340" y1="40" x2="130" y2="290" stroke="#7F77DD" stroke-width="1" opacity="0.5"/>
<line x1="340" y1="40" x2="550" y2="290" stroke="#7F77DD" stroke-width="1" opacity="0.5"/>
<line x1="130" y1="290" x2="550" y2="290" stroke="#7F77DD" stroke-width="1" opacity="0.5"/>
<!-- Top node: Intención -->
<g class="c-purple">
  <rect x="258" y="20" width="164" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Intención</text>
  <text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">¿El sistema hace lo que queremos?</text>
</g>
<!-- Bottom-left node: Robustez -->
<g class="c-teal">
  <rect x="40" y="270" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="130" y="293" text-anchor="middle" dominant-baseline="central">Robustez</text>
  <text class="ts" x="130" y="311" text-anchor="middle" dominant-baseline="central">¿Funciona fuera del entrenamiento?</text>
</g>
<!-- Bottom-right node: Capacidad -->
<g class="c-coral">
  <rect x="460" y="270" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="550" y="293" text-anchor="middle" dominant-baseline="central">Capacidad</text>
  <text class="ts" x="550" y="311" text-anchor="middle" dominant-baseline="central">¿Puede lograr el objetivo?</text>
</g>
<!-- Center label -->
<rect x="270" y="165" width="140" height="36" rx="8" fill="none" stroke="#7F77DD" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.7"/>
<text class="ts" x="340" y="187" text-anchor="middle" dominant-baseline="central">zona de alineación</text>
<!-- Edge tension labels -->
<text class="ts" x="220" y="185" text-anchor="middle" opacity="0.7">amplificación</text>
<text class="ts" x="460" y="185" text-anchor="middle" opacity="0.7">especificidad</text>
<text class="ts" x="340" y="260" text-anchor="middle" opacity="0.7">generalización</text>
</svg>