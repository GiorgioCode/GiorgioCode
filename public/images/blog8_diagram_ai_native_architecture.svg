<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="640" height="430" fill="#f8f9fc" rx="12"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Arquitectura AI-Native con Agentes Autónomos</text>

  <!-- Specifications box -->
  <rect x="195" y="58" width="250" height="76" rx="10" fill="#3b5bdb" stroke="#2244b8" stroke-width="1.5"/>
  <text x="320" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Specifications</text>
  <text x="320" y="105" text-anchor="middle" font-size="11.5" fill="#c5d0f0">OpenAPI · Schemas · Protobuf</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#a8bce0">AsyncAPI · GraphQL · JSON Schema</text>

  <!-- Arrow down to AI Agent -->
  <line x1="320" y1="134" x2="320" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- AI Coding Agents box -->
  <rect x="195" y="175" width="250" height="64" rx="10" fill="#0f172a" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#f1f5f9">AI Coding Agents</text>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#7dd3fc">LLMs · Agentes autónomos · Pipelines</text>

  <!-- Three branch arrows from AI Agent -->
  <!-- Left -->
  <line x1="320" y1="239" x2="320" y2="268" stroke="#64748b" stroke-width="2"/>
  <line x1="320" y1="268" x2="105" y2="268" stroke="#64748b" stroke-width="2"/>
  <line x1="105" y1="268" x2="105" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <!-- Center -->
  <line x1="320" y1="268" x2="320" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>
  <!-- Right -->
  <line x1="320" y1="268" x2="535" y2="268" stroke="#64748b" stroke-width="2"/>
  <line x1="535" y1="268" x2="535" y2="295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Generate Code box -->
  <rect x="30" y="295" width="150" height="62" rx="8" fill="#0f9e6e" stroke="#0a7d57" stroke-width="1.5"/>
  <text x="105" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Generar Código</text>
  <text x="105" y="339" text-anchor="middle" font-size="10.5" fill="#c6f0e2">Implementación</text>
  <text x="105" y="353" text-anchor="middle" font-size="10.5" fill="#c6f0e2">automatizada</text>

  <!-- Generate Tests box -->
  <rect x="245" y="295" width="150" height="62" rx="8" fill="#e07c00" stroke="#b56200" stroke-width="1.5"/>
  <text x="320" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Generar Tests</text>
  <text x="320" y="339" text-anchor="middle" font-size="10.5" fill="#fde8c0">Validación</text>
  <text x="320" y="353" text-anchor="middle" font-size="10.5" fill="#fde8c0">contractual</text>

  <!-- Generate Docs box -->
  <rect x="460" y="295" width="150" height="62" rx="8" fill="#9333ea" stroke="#7528c2" stroke-width="1.5"/>
  <text x="535" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Generar Docs</text>
  <text x="535" y="339" text-anchor="middle" font-size="10.5" fill="#e8d5f7">Documentación</text>
  <text x="535" y="353" text-anchor="middle" font-size="10.5" fill="#e8d5f7">sincronizada</text>

  <!-- Legend -->
  <rect x="40" y="390" width="560" height="28" rx="6" fill="#e2e8f0"/>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" fill="#475569">Las especificaciones se convierten en artefactos ejecutables que los agentes consumen directamente</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
</svg>
