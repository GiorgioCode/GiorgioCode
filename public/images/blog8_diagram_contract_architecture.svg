<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="640" height="420" fill="#f8f9fc" rx="12"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Arquitectura Contract-First (SDD)</text>

  <!-- Specification Layer box -->
  <rect x="200" y="60" width="240" height="72" rx="10" fill="#3b5bdb" stroke="#2244b8" stroke-width="1.5"/>
  <text x="320" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Specification Layer</text>
  <text x="320" y="111" text-anchor="middle" font-size="11.5" fill="#c5d0f0">OpenAPI · GraphQL · AsyncAPI</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#a8bce0">Protobuf · JSON Schema</text>

  <!-- Arrow down from Spec to splitter -->
  <line x1="320" y1="132" x2="320" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Three branch arrows -->
  <!-- Left -->
  <line x1="320" y1="170" x2="110" y2="170" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="170" x2="110" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Center -->
  <line x1="320" y1="170" x2="320" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Right -->
  <line x1="320" y1="170" x2="530" y2="170" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="170" x2="530" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SDKs box -->
  <rect x="40" y="205" width="140" height="58" rx="8" fill="#0f9e6e" stroke="#0a7d57" stroke-width="1.5"/>
  <text x="110" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SDKs</text>
  <text x="110" y="248" text-anchor="middle" font-size="11" fill="#c6f0e2">Clientes generados</text>

  <!-- Documentation box -->
  <rect x="245" y="205" width="150" height="58" rx="8" fill="#e07c00" stroke="#b56200" stroke-width="1.5"/>
  <text x="320" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Documentación</text>
  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#fde8c0">Auto-generada</text>

  <!-- Validation box -->
  <rect x="460" y="205" width="140" height="58" rx="8" fill="#9333ea" stroke="#7528c2" stroke-width="1.5"/>
  <text x="530" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Validación</text>
  <text x="530" y="248" text-anchor="middle" font-size="11" fill="#e8d5f7">Contratos y schemas</text>

  <!-- Merge arrows to Application Code -->
  <line x1="110" y1="263" x2="110" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="310" x2="320" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="263" x2="320" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="263" x2="530" y2="310" stroke="#64748b" stroke-width="2"/>
  <line x1="530" y1="310" x2="320" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Application Code box -->
  <rect x="210" y="320" width="220" height="60" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="320" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#f1f5f9">Application Code</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#94a3b8">Implementación derivada</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Footer note -->
  <text x="320" y="405" text-anchor="middle" font-size="10" fill="#94a3b8">Las especificaciones actúan como núcleo central del ecosistema de desarrollo</text>
</svg>
