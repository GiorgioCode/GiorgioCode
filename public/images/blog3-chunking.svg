<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300">
  <style>text{font-family:Arial,sans-serif;font-size:14px;fill:#4b5563;} rect,line,path{stroke:#4b5563;}</style>
  <text x="300" y="30" text-anchor="middle">Ejemplo de chunking</text>
  <rect x="200" y="60" width="200" height="40" fill="none" stroke="#4b5563"/>
  <text x="300" y="85" text-anchor="middle">Documento original</text>
  <line x1="300" y1="100" x2="300" y2="130" stroke="#4b5563" marker-end="url(#arrow)"/>
  <rect x="200" y="130" width="200" height="40" fill="none" stroke="#4b5563"/>
  <text x="300" y="155" text-anchor="middle">Chunk 1</text>
  <line x1="300" y1="170" x2="300" y2="200" stroke="#4b5563" marker-end="url(#arrow)"/>
  <rect x="200" y="200" width="200" height="40" fill="none" stroke="#4b5563"/>
  <text x="300" y="225" text-anchor="middle">Chunk 2</text>
  <line x1="300" y1="240" x2="300" y2="270" stroke="#4b5563" marker-end="url(#arrow)"/>
  <rect x="200" y="270" width="200" height="40" fill="none" stroke="#4b5563"/>
  <text x="300" y="295" text-anchor="middle">Chunk 3</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#4b5563" />
    </marker>
  </defs>
</svg>