  <rect x="50" y="200" width="500" height="60" fill="none" stroke="#4b5563"/>
  <text x="300" y="235" text-anchor="middle">Motor de búsqueda semántica</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
