<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1a1a18; }
      .th  { font-size: 14px; font-weight: 500; fill: #3C3489; }
      .ts  { font-size: 12px; font-weight: 400; fill: #534AB7; }
      .th-teal { font-size: 14px; font-weight: 500; fill: #085041; }
      .ts-teal  { font-size: 12px; font-weight: 400; fill: #0F6E56; }
      .th-gray  { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts-gray  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .ts-ann   { font-size: 12px; font-weight: 400; fill: #444441; }
      .arr { stroke: #888780; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- CAPA CLIENTE -->
  <rect x="30" y="30" width="260" height="300" rx="14"
        fill="#EEEDFE" fill-opacity="0.45" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="160" y="56" text-anchor="middle">Capa de cliente</text>
  <text class="ts" x="160" y="72" text-anchor="middle">clave privada nunca sale</text>

  <!-- Nodo: Sentence Transformers -->
  <rect x="54" y="90" width="212" height="52" rx="8"
        fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="160" y="112" text-anchor="middle" dominant-baseline="central">Sentence Transformers</text>
  <text class="ts" x="160" y="130" text-anchor="middle" dominant-baseline="central">genera embeddings en claro</text>

  <!-- Nodo: TenSEAL / CKKS -->
  <rect x="54" y="166" width="212" height="52" rx="8"
        fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="160" y="188" text-anchor="middle" dominant-baseline="central">TenSEAL / CKKS</text>
  <text class="ts" x="160" y="206" text-anchor="middle" dominant-baseline="central">cifra vectores, producto interno</text>

  <!-- Nodo: Descifrado -->
  <rect x="54" y="242" width="212" height="52" rx="8"
        fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="160" y="264" text-anchor="middle" dominant-baseline="central">Descifrado (cliente)</text>
  <text class="ts" x="160" y="282" text-anchor="middle" dominant-baseline="central">recupera similitudes en claro</text>

  <!-- flechas internas cliente -->
  <line x1="160" y1="142" x2="160" y2="164" class="arr" marker-end="url(#arrow)"/>
  <line x1="160" y1="218" x2="160" y2="240" class="arr" marker-end="url(#arrow)"/>

  <!-- CAPA SERVIDOR -->
  <rect x="380" y="30" width="260" height="300" rx="14"
        fill="#E1F5EE" fill-opacity="0.45" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="510" y="56" text-anchor="middle">Capa de servidor</text>
  <text class="ts-teal" x="510" y="72" text-anchor="middle">nunca ve datos en claro</text>

  <!-- Nodo: Indice auxiliar HNSW -->
  <rect x="404" y="90" width="212" height="52" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="510" y="112" text-anchor="middle" dominant-baseline="central">Indice auxiliar HNSW</text>
  <text class="ts-teal" x="510" y="130" text-anchor="middle" dominant-baseline="central">vector no semantico, prefiltrado</text>

  <!-- Nodo: Payload Qdrant -->
  <rect x="404" y="166" width="212" height="52" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="510" y="188" text-anchor="middle" dominant-baseline="central">Payload Qdrant</text>
  <text class="ts-teal" x="510" y="206" text-anchor="middle" dominant-baseline="central">ciphertexts + metadatos</text>

  <!-- Nodo: API REST / gRPC -->
  <rect x="404" y="242" width="212" height="52" rx="8"
        fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th-teal" x="510" y="264" text-anchor="middle" dominant-baseline="central">API REST / gRPC</text>
  <text class="ts-teal" x="510" y="282" text-anchor="middle" dominant-baseline="central">devuelve candidatos cifrados</text>

  <!-- flechas internas servidor -->
  <line x1="510" y1="142" x2="510" y2="164" class="arr" marker-end="url(#arrow)"/>
  <line x1="510" y1="218" x2="510" y2="240" class="arr" marker-end="url(#arrow)"/>

  <!-- FLECHAS CLIENTE <-> SERVIDOR -->

  <!-- vector cifrado: CKKS -> Payload -->
  <path d="M266 192 L380 192" class="arr" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="323" y="186" text-anchor="middle">vector cifrado</text>

  <!-- consulta cifrada: CKKS -> API -->
  <path d="M266 268 Q323 268 323 294 L380 294" class="arr" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="323" y="288" text-anchor="middle">consulta cifrada</text>

  <!-- ciphertexts regresan: API -> Descifrado -->
  <path d="M404 268 Q350 268 350 264 L266 264" class="arr" stroke-width="1"
        stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="335" y="258" text-anchor="middle">ciphertexts</text>

  <!-- RESULTADO FINAL -->
  <rect x="200" y="385" width="280" height="52" rx="8"
        fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th-gray" x="340" y="407" text-anchor="middle" dominant-baseline="central">Ranking de similitud</text>
  <text class="ts-gray" x="340" y="425" text-anchor="middle" dominant-baseline="central">ids ordenados por puntuacion descifrada</text>

  <!-- flecha descifrado -> ranking -->
  <path d="M160 294 L160 411 Q160 437 200 437" class="arr" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LEYENDA -->
  <line x1="40" y1="470" x2="80" y2="470" class="arr" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="88" y="474">datos cifrados (ciphertext)</text>

  <line x1="40" y1="492" x2="80" y2="492" class="arr" stroke-width="1"
        stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="ts-ann" x="88" y="496">retorno de candidatos cifrados</text>

  <text class="ts-ann" x="40" y="522">el servidor opera sobre ciphertexts; el producto interno se calcula en el cliente</text>
</svg>
